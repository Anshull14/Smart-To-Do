<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>Smart To-Do List</h1>
            <p>Organize your tasks efficiently</p>
            </header>

            <!.. summary counts section -->
            <section class="summary" aria-label="Task summary">
                <div class="summary-card">Total: <span id="total-count">0</span></div>
                <div class="summary-card">Completed: <span id="completed-count">0</span></div>
                <div class="summary-card">Pending: <span id="pending-count">0</span></div>
            </section>

            <!.. add/edit task form section -->
            <section class="task-form-section">
                <form id="task-form">
                    <input type="text" id="task-title" placeholder="Task title" required maxlength="100">
                    <textarea id="task-description" placeholder="Description (optional)" rows="2"></textarea>

                    <div class="form-row">
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                        <input type="date" id="task-due-date">
                    </div>
                    <button type="submit" id="submit-btn">Add Task</button>
                </form> 
            </section>


            <!-- Search and filters -->
            <section class="controls" aria-label="Search and filters">
            <input type="search" id="search-input" placeholder="Search tasks...">
            <select id="status-filter">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <select id="priority-filter">
                <option value="all">All priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            </section>

            <!-- Task list (JS will render items here) -->
            <section class="task-list-section">
            <ul id="task-list"></ul>
            <p id="empty-message">No tasks yet. Add your first one above!</p>
            </section>
        </main>

        <script src="script.js"></script>
        </body>
        </html>
